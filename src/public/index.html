<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>学生报考确认系统 · 交互原型 v2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F1EFE8;color:#2C2C2A;font-size:15px;line-height:1.6}
.wrap{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 24px rgba(0,0,0,.06)}
.wrap.wide{max-width:980px}
.hd{background:#185FA5;color:#fff;padding:14px 18px}
.hd h1{margin:0;font-size:16px;font-weight:500}
.hd p{margin:2px 0 0;font-size:12px;opacity:.85}
.banner{background:#FAEEDA;color:#633806;font-size:12px;padding:8px 18px;border-bottom:1px solid #FAC775}
.pad{padding:18px}
.stepbar{display:flex;gap:4px;padding:12px 18px 0}
.stepbar i{flex:1;height:4px;border-radius:2px;background:#D3D1C7}
.stepbar i.on{background:#185FA5}
h2.sec{font-size:15px;font-weight:500;margin:0 0 4px}
p.hint{font-size:12px;color:#5F5E5A;margin:0 0 14px}
label.f{display:block;font-size:13px;color:#444441;margin:14px 0 6px}
select,input[type=text],textarea{width:100%;padding:11px 12px;border:1px solid #B4B2A9;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:#2C2C2A}
select:disabled,input:disabled{background:#F1EFE8;color:#888780}
textarea{min-height:88px;resize:vertical}
.sug{border:1px solid #B4B2A9;border-top:none;border-radius:0 0 8px 8px;margin-top:-6px;overflow:hidden}
.sug div{padding:10px 12px;font-size:14px;border-top:1px solid #F1EFE8;cursor:pointer}
.card{border:1px solid #B4B2A9;border-radius:12px;padding:14px;margin-bottom:12px}
.ro{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:14px}
.ro b{font-weight:400;color:#5F5E5A}
.ro span{font-weight:500;word-break:break-all}
.ro span.en{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.lock{font-size:11px;color:#854F0B;background:#FAEEDA;display:inline-block;padding:2px 8px;border-radius:4px;margin-bottom:12px}
.srcnote{background:#E6F1FB;border-left:3px solid #185FA5;color:#0C447C;font-size:12.5px;padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:12px}
.idcard{border:1px solid #185FA5;background:#E6F1FB;border-radius:12px;padding:14px 16px;margin-bottom:12px;text-align:center}
.idcard .lab{font-size:11px;color:#185FA5;letter-spacing:1px;margin-bottom:6px}
.idcard .big{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:600;letter-spacing:1.5px;color:#0C447C;word-break:break-all;line-height:1.3}
.idcard .cn{font-size:17px;font-weight:600;color:#2C2C2A;margin-top:4px}
.idcard .sub{font-size:12.5px;color:#5F5E5A;margin-top:5px}
.idcard .tip{font-size:12px;color:#A32D2D;margin-top:8px;background:#FBEAEA;border-radius:6px;padding:7px 9px}
.radio{border:1px solid #B4B2A9;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.radio.on{border-color:#185FA5;background:#E6F1FB}
.radio input{margin-top:3px;accent-color:#185FA5}
.radio small{display:block;font-size:12px;color:#5F5E5A}
.subj{border:1px solid #B4B2A9;border-radius:12px;margin-bottom:10px;overflow:hidden}
.subj>.top{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.subj.sel{border-color:#185FA5}
.subj.sel>.top{background:#E6F1FB}
.subj .cb{width:19px;height:19px;border:2px solid #888780;border-radius:5px;flex:none}
.subj.sel .cb{background:#185FA5;border-color:#185FA5;position:relative}
.subj.sel .cb:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.subj .nm{font-size:15px;font-weight:500}
.subj .nm em{font-style:normal;font-size:12px;color:#5F5E5A;margin-left:6px}
.body{display:none;padding:2px 14px 14px;border-top:1px dashed #D3D1C7}
.subj.sel .body{display:block}
.grp{margin-top:10px}
.grp>b{font-size:12px;color:#444441;font-weight:500;display:block;margin-bottom:6px}
.unit{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:14px;cursor:pointer;border-top:1px solid #F1EFE8}
.unit .ub{width:18px;height:18px;border:2px solid #888780;border-radius:4px;flex:none}
.unit.on .ub{background:#185FA5;border-color:#185FA5;position:relative}
.unit.on .ub:after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
canvas.sign{width:100%;height:150px;border:1px dashed #888780;border-radius:10px;background:#fff;touch-action:none;display:block}
.signrow{display:flex;justify-content:space-between;align-items:center;margin:6px 0 0}
.signrow small{font-size:12px;color:#5F5E5A}
.notice{border:1px solid #BA7517;background:#FAEEDA;border-radius:12px;padding:14px;margin-bottom:12px}
.notice h4{margin:0 0 8px;font-size:14px;font-weight:500;color:#633806}
.notice ol{margin:0;padding-left:20px;font-size:12.5px;color:#633806}
.notice li{margin-bottom:5px}
.agree{display:flex;gap:10px;align-items:flex-start;border:1px solid #B4B2A9;border-radius:10px;padding:12px 14px;cursor:pointer;font-size:14px}
.agree.on{border-color:#185FA5;background:#E6F1FB}
.agree input{margin-top:3px;accent-color:#185FA5}
button{font-family:inherit;font-size:15px;border-radius:10px;padding:12px 16px;border:none;cursor:pointer}
.btn{width:100%;background:#185FA5;color:#fff;margin-top:18px}
.btn:disabled{background:#B4B2A9}
.btn.gh{background:#fff;color:#185FA5;border:1px solid #185FA5}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btnrow .btn{width:auto;margin-top:0;flex:1}
.btnrow .btn.gh{flex:0 0 34%}
.link{background:none;color:#185FA5;font-size:13px;padding:0;text-decoration:underline}
.sum{border:1px solid #B4B2A9;border-radius:12px;padding:14px;margin-bottom:12px}
.sum h4{margin:0 0 6px;font-size:14px;font-weight:500}
.sum ul{margin:0;padding-left:18px;font-size:13px;color:#444441}
.err{background:#FCEBEB;color:#A32D2D;font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px}
.ok{background:#E1F5EE;color:#0F6E56;font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px}
.warnbox{background:#FAEEDA;border:1px solid #FAC775;color:#633806;border-radius:12px;padding:16px;text-align:center;font-size:14px}
.warnbox b{display:block;font-size:15px;margin-bottom:4px}
.lockbox{background:#EEEDFE;border:1px solid #AFA9EC;color:#3C3489;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:12px}
.lockbox b{display:block;font-size:14px;margin-bottom:3px}
.chg{background:#FAEEDA;color:#854F0B;font-size:11.5px;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:400;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border:1px solid #D3D1C7;padding:6px 8px;text-align:left}
th{background:#F1EFE8;font-weight:500;white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;background:#E1F5EE;color:#0F6E56}
.tag.bad{background:#FCEBEB;color:#A32D2D}
.tag.warn{background:#FAEEDA;color:#854F0B}
.tag.wait{background:#F1EFE8;color:#5F5E5A}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border:1px solid #B4B2A9;border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:500;color:#185FA5}
.stat span{font-size:12px;color:#5F5E5A}
.dbg{background:#F1EFE8;font-size:12px;padding:10px 18px;border-top:1px solid #D3D1C7}
.dbg select{width:auto;display:inline-block;padding:4px 8px;font-size:12px}
.foot{padding:14px 18px 30px;font-size:12px;color:#888780}
.mini{padding:2px 6px;font-size:12px;border-radius:6px;border:1px solid #B4B2A9;background:#fff}
.mini.act{background:#185FA5;color:#fff;border-color:#185FA5}
@media print{.hd,.banner,.dbg,.stepbar,.noprint,.foot{display:none!important}body{background:#fff}.wrap{box-shadow:none;max-width:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="hd">
    <h1 id="hdTitle">学生报考信息确认</h1>
    <p id="hdsub">正在连接服务器…</p>
  </div>
  <div class="banner" id="hdBanner">正在载入本次报考配置…</div>
  <div id="view"></div>
  <div class="dbg noprint">
    教务调试：
    <select id="dbgWin">
      <option value="open">时间窗口：开放中（演示）</option>
      <option value="before">时间窗口：尚未开放</option>
      <option value="closed">时间窗口：已截止</option>
      <option value="auto">按真实时间判断</option>
    </select>
    <button class="link" id="dbgAdmin">教务后台</button>
    <button class="link" id="dbgReset">清空本机缓存</button>
    <span class="link" id="syncTip" style="cursor:default"></span>
  </div>
</div>

<script>
/* ================= 示例数据：待教务提供正式清单后替换 ================= */
var CLASSES = ["IG1","IG2","AS1","AS2","AS3","A21","A22"];
/* 虚构演示名单：仅在离线/无服务端时加载。生产模式前端不预置全量学生数据。 */
var DEMO_ROSTER = [
  {id:"S001",cls:"IG1",cn:"张思远",en:"ZHANG SIYUAN",g:"男",dob:"2009-03-12"},
  {id:"S002",cls:"IG1",cn:"李佳怡",en:"LI JIAYI",g:"女",dob:"2009-07-04"},
  {id:"S003",cls:"IG2",cn:"王一诺",en:"WANG YINUO",g:"女",dob:"2009-01-22"},
  {id:"S004",cls:"IG2",cn:"陈子涵",en:"CHEN ZIHAN",g:"男",dob:"2009-11-30"},
  {id:"S005",cls:"AS1",cn:"刘雨桐",en:"LIU YUTONG",g:"女",dob:"2008-05-18"},
  {id:"S006",cls:"AS1",cn:"赵子睿",en:"ZHAO ZIRUI",g:"男",dob:"2008-09-09"},
  {id:"S007",cls:"AS2",cn:"孙嘉禾",en:"SUN JIAHE",g:"女",dob:"2008-02-14"},
  {id:"S008",cls:"AS2",cn:"周慕辰",en:"ZHOU MUCHEN",g:"男",dob:"2008-04-26"},
  {id:"S009",cls:"AS3",cn:"吴静怡",en:"WU JINGYI",g:"女",dob:"2008-08-15"},
  {id:"S010",cls:"AS3",cn:"郑浩然",en:"ZHENG HAORAN",g:"男",dob:"2008-12-03"},
  {id:"S011",cls:"A21",cn:"何思远",en:"HE SIYUAN",g:"男",dob:"2007-06-11"},
  {id:"S012",cls:"A21",cn:"黄诗涵",en:"HUANG SHIHAN",g:"女",dob:"2007-10-20"},
  {id:"S013",cls:"A22",cn:"徐乐言",en:"XU LEYAN",g:"女",dob:"2007-03-08"},
  {id:"S014",cls:"A22",cn:"林嘉树",en:"LIN JIASHU",g:"男",dob:"2007-09-17"}
];
var STUDENTS = [];
var SUBJECTS = [
  {k:"math",n:"数学",en:"Mathematics",groups:[
    {n:"",units:["P1-WMA11","P2-WMA12","P3-WMA13","P4-WMA14","S1-WST01","S2-WST02","S3-WST03","M1-WME01","M2-WME02","M3-WME03","F1-WFM01","F2-WFM02","F3-WFM03","D1-WDM11"]},
    {n:"Cashin（合卷）",units:["基数Cashin-YMA01","进数Cashin-YFM01"]}
  ]},
  {k:"biz",n:"经商",en:"Business",groups:[
    {n:"经济 Economics",units:["经济U1-WEC11","经济U2-WEC12","经济U3-WEC13","经济U4-WEC14","经济U1U2 Cashin-XEC11","经济U1U2U3U4 Cashin-YEC11"]},
    {n:"商业 Business",units:["商业U1-WBS11","商业U2-WBS12","商业U3-WBS13","商业U4-WBS14","商业U1U2 Cashin-XBS11","商业U1U2U3U4 Cashin-YBS11"]},
    {n:"会计 Accounting",units:["会计U1-WAC11","会计U2-WAC12","会计U1 Cashin-XAC11","会计U1U2 Cashin-YAC11"]}
  ]},
  {k:"sci",n:"科学",en:"Sciences",groups:[
    {n:"物理 Physics",units:["物理U1-WPH11","物理U2-WPH12","物理U3-WPH13","物理U4-WPH14","物理U5-WPH15","物理U6-WPH16","物理123 Cashin-XPH11","物理123456 Cashin-YPH11"]},
    {n:"化学 Chemistry",units:["化学U1-WCH11","化学U2-WCH12","化学U3-WCH13","化学U4-WCH14","化学U5-WCH15","化学U6-WCH16","化学123 Cashin-XCH11","化学123456 Cashin-YCH11"]},
    {n:"生物 Biology",units:["生物U1-WBI11","生物U2-WBI12","生物U3-WBI13","生物U4-WBI14","生物U5-WBI15","生物U6-WBI16","生物123 Cashin-XBI11","生物123456 Cashin-YBI11"]}
  ]},
  {k:"oth",n:"其他",en:"Other",free:true}
];
/* 姓名大写统一规范：无论主数据存的是 ZHANG SAN 还是 Zhang San，一律按全大写展示与导出 */
DEMO_ROSTER.forEach(function(s){ s.en = String(s.en||"").toUpperCase().replace(/\s+/g," ").trim(); });
var WINDOW = {start:"2026-10-25T08:00", end:"2026-11-05T18:00"};
var WIN_TEXT = "2026 年 10 月 25 日 08:00 至 11 月 5 日 18:00";
var NOTICES = [
  "本申请<b>每人仅可提交一次</b>。提交后本人不能自行修改或重复提交；确需变更的，须由本人向教务提出申请，经教务处理后方为有效。",
  "出生日期是本系统核验本人身份的唯一凭据，请勿告知他人。本页访问已记录，非本人查询将被追查。",
  "姓名大写拼音、性别、出生日期将用于<b>考试局报名及成绩证书</b>，须逐项核对；如有错误请勾选「信息有误」写明正确内容，由教务更正后再提交，不要将错就错。",
  "线上签名即确认本人已核阅并确认上述基本信息无误。班级纸质确认表<b>仅确认报考科目与单元</b>，班会期间须逐项核对后本人签名，纸质件留档。",
  "未在规定时间内提交视为自动放弃本次报考；窗口关闭后系统锁定，仅可查看已提交内容，不再受理提交与修改。"
];
var SRC_NOTE = "以下信息由教务根据<b>入学学籍表</b>生成，请逐项核对。<b>姓名大写拼音将用于考试局报名及成绩证书</b>，如与身份证件不一致，须立即提交更正，否则可能影响考试成绩与证书发放。";

/* ================= 状态 ================= */
function freshState(){ return {step:0, cls:"", nameQ:"", sid:"", vrf:false, dobTry:"", dobOK:"", nameOk:false, sid4:"", privacyOk:false, probeWarn:false, ok:null, errText:"", sig1:"", picked:{}, other:{s:"",u:""}, sig2:"", subAt:"", agree:false, admin:false}; }
var S = freshState();
var LSK = "reg_records_v2", LSU = "reg_current_v2", LSM = "reg_master_v3", LST = "reg_tickets_v3", LSLOG = "reg_logs_v1";
var LOG_ACT = {verify_ok:"验证通过",verify_fail:"验证失败",verify_nomatch:"姓名未匹配",submit:"首次提交",
  resubmit:"重新提交",input:"输入/同步",ticket_confirm:"复核已更正档案",admin_save:"教务保存",
  push_denied:"越权写入被拒",push_closed:"窗口关闭后写入被拒",push_blocked:"工单未结被拒",
  privacy_consent:"同意信息告知",privacy_denied:"未同意信息告知",admin_backup:"导出加密备份",
  admin_restore:"恢复加密备份",admin_config:"修改考试季配置"};
function logs(){ try{return JSON.parse(localStorage.getItem(LSLOG)||"[]")}catch(e){return []} }
function load(){try{return JSON.parse(localStorage.getItem(LSK)||"{}")}catch(e){return {}}}
function save(r){localStorage.setItem(LSK,JSON.stringify(r)); syncLater();}
function saveCur(o){localStorage.setItem(LSU,JSON.stringify(o))}
/* 主数据更正层：教务的更正不覆盖学籍原始表，单独存一层覆写，并留变更记录与版本号 */
function master(){try{return JSON.parse(localStorage.getItem(LSM)||"{}")}catch(e){return {}}}
function saveMaster(m){localStorage.setItem(LSM,JSON.stringify(m)); syncLater();}
/* 纠错工单：status = wait（待教务处理）/ rejected（驳回）/ fixed（已更正待学生复核）/ closed（学生已复核通过） */
function tickets(){try{return JSON.parse(localStorage.getItem(LST)||"{}")}catch(e){return {}}}
function saveTickets(t){localStorage.setItem(LST,JSON.stringify(t)); syncLater();}
function myTicket(id){return tickets()[id]||null}
var TICKET_MAX = 2;
var FLD = {en:"姓名大写", cn:"中文姓名", g:"性别", dob:"出生日期", cls:"班级"};
var ADMIN_EDIT = null;
/* 出生日期校验：同一设备连续失败 FAIL_MAX 次即锁定 FAIL_LOCK_MIN 分钟，并告警教务 */
var FAIL_MAX = 3, FAIL_LOCK_MIN = 15;
var LSF = "reg_fail_v3", LSA = "reg_alerts_v3";
/* 纸质确认表建议声明：基本信息已在线上确认，纸质表只确认科目 */
var PAPER_NOTE = "本人已在线上核对并确认本人基本信息（姓名大写拼写、性别、出生日期）无误；本次签字仅确认下列报考科目与单元，请逐项核对后签名。";

/* ================= 服务端同步层 =================
   在线：服务端是唯一数据源，本机 localStorage 只作缓存；
   离线（直接双击打开 file://）：自动退回单机演示模式，逻辑不变。 */
var API_ON = false, ADMIN_TOKEN = "", SYNC_LOCK = false, SERVER_SEASON = "";
var SEASON_LIST = [];
/* 由 /api/boot 下发：第二验证因子与个人信息处理告知（离线时走内置默认值） */
var SECOND_FACTOR = "off", PRIVACY_REQUIRED = true;
var PRIVACY_NOTE = "为完成本次考试报名，本系统需处理你的个人信息（姓名、性别、出生日期、报考科目），并记录访问时间、IP 地址及终端设备型号用于身份核验与流程留痕。上述信息仅用于本次报考及学校教务管理，按学校规定期限留存，不向无关第三方提供。继续操作即表示你已阅读并同意上述处理；如不同意请联系教务线下办理。";
/* UA-CH 高熵值：页面加载即异步取，取到后并入后续所有上报。属客户端上报，明确标注可伪造 */
var UA_CH = null;
(function(){
  try{
    var d = navigator.userAgentData;
    if(d && d.getHighEntropyValues){
      d.getHighEntropyValues(["model","platform","platformVersion","architecture","bitness","fullVersionList","wow64"])
        .then(function(v){ UA_CH = v || null; }).catch(function(){});
    }
  }catch(e){}
})();
function authHeaders(base){ var x = base||{}; if(ADMIN_TOKEN) x["X-Admin-Token"] = ADMIN_TOKEN; return x; }
function apiGet(p){ return fetch(p,{cache:"no-store",headers:authHeaders()}).then(function(r){return r.json()}) }
function apiPost(p,o){ return fetch(p,{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(o||{}),cache:"no-store"}).then(function(r){return r.json()}) }
/* 客户端补充的设备信息：服务端单独存放并标注「可伪造」，主判定以服务端 UA 解析为准 */
function deviceHint(){
  try{
    var d = navigator.userAgentData || {};
    var out = {ua:String(navigator.userAgent||""), platform:String(navigator.platform||""),
      screen:(screen.width||0)+"x"+(screen.height||0), dpr:String(window.devicePixelRatio||""),
      model:String(d.model||""), mobile:String(d.mobile===undefined?"":d.mobile), vendor:String(d.vendor||"")};
    if(UA_CH){
      out.uaModel = String(UA_CH.model||"");
      out.uaPlatform = String(UA_CH.platform||"");
      out.uaPlatformVersion = String(UA_CH.platformVersion||"");
      out.uaArch = String(UA_CH.architecture||"");
      out.uaBitness = String(UA_CH.bitness||"");

function normDob(v){
  var p = String(v||"").trim().split(/\D+/).filter(function(x){return x!==""});
  if(p.length===3 && p[0].length===4 && p[1].length<=2 && p[2].length<=2){
    var mm = p[1], dd = p[2];
    return p[0]+"-"+(mm.length<2?"0"+mm:mm)+"-"+(dd.length<2?"0"+dd:dd);

  var d = String(v||"").replace(/\D/g,"");

function pushProbe(sid){

  if(!d.t || Date.now()-d.t > PROBE_WIN_MIN*60000) d = {t:Date.now(), sids:[]};

/* 离线单机模式的验证逻辑（保留，作为无法连服务器时的兜底） */
function doVerifyLocal(){
  var f = failInfo();
  if(f.until && f.until > Date.now()){ $("msg").innerHTML = '<div class="err">本设备已暂时锁定，请在 '+esc(fmtTime(new Date(f.until).toISOString()))+' 后重试，或携带证件到教务线下核实。</div>'; return; }
  if(!S.cls){ $("msg").innerHTML = '<div class="err">请先选择所在班级。</div>'; return; }
  var q = (($("inpName").value)||"").trim();
  if(!q){ $("msg").innerHTML = '<div class="err">请输入完整姓名。</div>'; return; }
  var pool = allStu().filter(function(s){return s.cls===S.cls});
  var m = pool.filter(function(s){return s.cn===q || s.en.replace(/\s+/g,"")===q.toUpperCase().replace(/\s+/g,"")});
  if(m.length!==1){
    $("msg").innerHTML = '<div class="err">未匹配到记录。请核对班级与姓名，并确认已输入<b>完整姓名</b>；仍无法匹配请联系教务核实名单。</div>';
    return;
  }
  S.sid = m[0].id; S.nameQ = q;
  var pc = pushProbe(S.sid);
  S.probeWarn = (pc >= PROBE_MAX);
  if(S.probeWarn) pushAlert(S.sid, false);
  saveCur(S);
  var dv = $("inpDob"), v = (dv && dv.value||"").trim();
  if(!v){ $("msg").innerHTML = '<div class="err">请输入出生日期（公历，例：2009-03-21）。</div>'; return; }
  S.dobTry = v; saveCur(S);
  var st = stu(S.sid), nd = normDob(v), ok = (nd === normDob(st.dob));
  pushAlert(S.sid, ok);
  if(ok){ S.vrf=true; S.nameOk=false; saveCur(S); saveFail({n:0, until:0}); goAfterVerify(); return; }
  /* 不匹配 */
  var recA = recOf(S.sid);
  if(recA && !recA.unlocked){
    /* 已提交过的记录：必须验证通过才能查看本人回执，不放行 */
    S.vrf = false;
    var n2 = f.n + 1, hitMax = (n2 >= FAIL_MAX);
    saveFail(hitMax ? {n:n2, until:Date.now()+FAIL_LOCK_MIN*60000} : {n:n2, until:0});
    var tail = hitMax
      ? ('本设备已暂时锁定至 '+esc(fmtTime(new Date(Date.now()+FAIL_LOCK_MIN*60000).toISOString()))+'，请稍后重试或携带证件到教务线下核实。')
      : ('剩余尝试 '+(FAIL_MAX-n2)+' 次，超限将锁定本设备 '+FAIL_LOCK_MIN+' 分钟并通知教务。');
    $("msg").innerHTML = '<div class="err">出生日期验证未通过。查看已提交的报考信息须通过本人身份验证，'+tail+'</div>'
      + '<div class="lockbox"><b>若怀疑是姓名输错</b>系统匹配到的是：'+esc(maskCn(st.cn))+' · '+esc(st.cls)+' · '+esc(st.g)+'。若这不是你，请返回上方修改姓名。</div>';
    saveCur(S); return;
  }
  var T = tickets(), old = T[S.sid];
  /* 被驳回的工单不作为放行凭据：仍须用正确出生日期通过本人验证 */
  if(!S.nameOk){ $("msg").innerHTML = nameCheckHTML(st, nd); bindNameCheck(); return; }
  /* 本人已确认姓名无误：计一次失败、生成出生日期纠错工单并放行（提交仍锁定） */
  var n3 = f.n + 1, hit3 = (n3 >= FAIL_MAX);
  saveFail(hit3 ? {n:n3, until:Date.now()+FAIL_LOCK_MIN*60000} : {n:n3, until:0});
  var round = old ? (old.status==="wait" ? (old.round||1) : (old.round||0)+1) : 1;
  T[S.sid] = {status:"wait", round:round, text:"出生日期验证不一致：本人填写 "+nd+"，与学籍记录不符，请教务线下核实。",
    at:new Date().toISOString(), auto:true, dobTry:nd};
  saveTickets(T);
  S.vrf=true; S.nameOk=false; saveCur(S); goAfterVerify();
}
/* 在线验证：姓名与出生日期都送到服务端比对，学生名单不下发到浏览器 */
function nameCheckMasked(mk, nd, ex){

    ? '验证信息不匹配（你填写的出生日期是 '+esc(nd)+'，还需核对学号后四位）'

  if(ex && ex.locked) h += '<div class="err">验证失败次数已达上限，本设备已暂时锁定至 '+esc(fmtTime(new Date(ex.until||0).toISOString()))+'。请稍后重试，或携带证件到教务线下核实。</div>';
  else if(ex && ex.fails) h += '<p class="hint">本设备已失败 '+ex.fails+' 次，还可尝试 '+Math.max(0, FAIL_MAX-ex.fails)+' 次；超限将暂时锁定。</p>';

    + '。<br>若这不是你，请返回上方修改姓名；若确是你，说明学籍记录的出生日期可能有问题，可提交教务核实。</div>';
  h += '<div class="agree'+(S.nameOk?" on":"")+'" id="nmOk"><input type="checkbox" id="nmOkCb"'+(S.nameOk?" checked":"")+'><div>我确认姓名与班级输入无误，是学籍记录的出生日期需要核实</div></div>';
  h += '<button class="btn" id="btnNameOk"'+(S.nameOk?"":" disabled")+'>确认姓名无误，提交核实并继续</button>';

function doVerify(){
  if(!API_ON){ doVerifyLocal(); return; }
  var f = failInfo();
  if(f.until && f.until > Date.now()){ $("msg").innerHTML = '<div class="err">本设备已暂时锁定，请在 '+esc(fmtTime(new Date(f.until).toISOString()))+' 后重试，或携带证件到教务线下核实。</div>'; return; }
  if(!S.cls){ $("msg").innerHTML = '<div class="err">请先选择所在班级。</div>'; return; }
  var q = (($("inpName").value)||"").trim();
  if(!q){ $("msg").innerHTML = '<div class="err">请输入完整姓名。</div>'; return; }
  var dv = $("inpDob"), v = (dv && dv.value||"").trim();
  if(!v){ $("msg").innerHTML = '<div class="err">请输入出生日期（例：2009-03-21）。</div>'; return; }
  var s4el = $("inpSid4"), sid4 = s4el ? (s4el.value||"").trim() : "";
  if(SECOND_FACTOR === "sid4" && !/^\d{4}$/.test(sid4)){
    $("msg").innerHTML = '<div class="err">请填写 4 位数字的学号后四位。</div>'; return;
  }
  if(PRIVACY_REQUIRED && !S.privacyOk){
    $("msg").innerHTML = '<div class="err">请先阅读并勾选同意「个人信息处理告知」，再进行身份验证。</div>'; return;
  }
  S.nameQ = q; S.dobTry = v; S.sid4 = sid4; saveCur(S);
  var btn = $("btnVrf"); if(btn){ btn.disabled = true; btn.textContent = "正在验证…"; }
  apiPost("/api/verify",{cls:S.cls, name:q, dob:v, nameOk:!!S.nameOk,
    sid4:sid4, privacyOk:!!S.privacyOk, deviceHint:deviceHint()}).then(function(res){
    if(btn){ btn.disabled = false; btn.textContent = "验证并查看我的信息"; }
    if(!res || !res.code){ $("msg").innerHTML = '<div class="err">服务器未响应，请稍后重试。</div>'; return; }
    if(res.code === "privacy"){
      $("msg").innerHTML = '<div class="err">请先阅读并勾选同意「个人信息处理告知」，再进行身份验证。</div>'; return;
    }
    if(res.code === "nomatch"){
      $("msg").innerHTML = '<div class="err">未匹配到记录。请核对班级与姓名，并确认已输入<b>完整姓名</b>；仍无法匹配请联系教务核实名单。</div>'; return;
    }
    if(res.code === "locked"){
      var n = res.n||0, un = res.until||0;
      saveFail({n:n, until:un});
      S.vrf = false; saveCur(S);
      var tail = (un && un > Date.now())
        ? ('本设备已暂时锁定至 '+esc(fmtTime(new Date(un).toISOString()))+'，请稍后重试或携带证件到教务线下核实。')
        : ('剩余尝试 '+Math.max(0, FAIL_MAX-n)+' 次，超限将锁定本设备 '+FAIL_LOCK_MIN+' 分钟并通知教务。');
      var who = res.masked ? ('<div class="lockbox"><b>若怀疑是姓名输错</b>系统匹配到的是：'+esc(res.masked.cn)+' · '+esc(res.masked.cls)+' · '+esc(res.masked.g)+'。若这不是你，请返回上方修改姓名。</div>') : '';
      $("msg").innerHTML = '<div class="err">出生日期验证未通过。查看已提交的报考信息须通过本人身份验证，'+tail+'</div>'+who;
      return;
    }
    if(res.code === "nameCheck"){
      S.sid = res.sid; S.nameOk = false; saveCur(S);
      if(res.fails) saveFail({n:res.fails, until:res.until||0});
      $("msg").innerHTML = nameCheckMasked(res.masked, res.tryDob, res); bindNameCheck();
      return;
    }
    if(res.code === "ticket"){
      /* 出生日期未通过：只登记等待教务核实，绝不进入本人档案、也不清零失败计数 */
      S.vrf = false; S.nameOk = false; saveCur(S);
      if(res.fails) saveFail({n:res.fails, until:res.until||0});
      var lk = res.locked ? '<div class="err">验证失败次数已达上限，本设备已暂时锁定，请稍后重试或联系教务线下核实。</div>' : '';
      $("msg").innerHTML = lk + '<div class="lockbox"><b>已提交教务核实</b>你填写的出生日期与学籍记录不一致，教务核对后会联系你。请核对身份证件后重新验证，或携带证件到教务线下处理。</div>';
      return;
    }
    SYNC_LOCK = true;
    S.sid = res.sid; S.dobOK = res.dob; S.vrf = true; S.nameOk = false;
    STUDENTS = STUDENTS.filter(function(x){ return x.id !== res.sid }).concat([res.student]);
    try{ sessionStorage.setItem("reg_self_"+(SERVER_SEASON||""), JSON.stringify(res.student)); }catch(e){}
    var mm = master(); delete mm[res.sid]; saveMaster(mm);
    if(res.record){ var rr = load(); rr[res.sid] = res.record; save(rr); }
    if(res.ticket){ var tt = tickets(); tt[res.sid] = res.ticket; saveTickets(tt); }
    SYNC_LOCK = false;
    saveFail({n:0, until:0});
    saveCur(S);
    goAfterVerify();
  }).catch(function(){
    if(btn){ btn.disabled = false; btn.textContent = "验证并查看我的信息"; }
    API_ON = false; syncTip("已退回离线模式（数据只存在本机）", true); doVerifyLocal();
  });
}
function goAfterVerify(){
  var rec = recOf(S.sid);
  if(winState()==="closed"){ S.step = rec ? 4 : 5; saveCur(S); render(); return; }
  if(rec && !rec.unlocked){ S.step=4; saveCur(S); render(); return; }
  if(rec && rec.unlocked){
    S.ok = rec.ok; S.errText = rec.errText; S.sig1 = rec.sig1;
    S.picked = rec.picked||{}; S.other = rec.other||{s:"",u:""}; S.sig2 = ""; S.agree = false;
    S.step=1; saveCur(S); render(); return;
  }
  S.step=1; saveCur(S); render();
}

function bindInfo(){
  function sync(){
    $("rOk").classList.toggle("on", S.ok===true);
    $("rNo").classList.toggle("on", S.ok===false);
    $("rOk").querySelector("input").checked = (S.ok===true);
    $("rNo").querySelector("input").checked = (S.ok===false);
    $("okBox").style.display = S.ok===true?"block":"none";
    $("noBox").style.display = S.ok===false?"block":"none";
  }
  function pick(v){
    if(S.ok===v) return;
    S.ok = v; saveCur(S); sync();
  }
  $("rOk").onclick = function(){ pick(true) };
  $("rNo").onclick = function(){ pick(false) };
  $("rOk").querySelector("input").onchange = function(){ pick(true) };
  $("rNo").querySelector("input").onchange = function(){ pick(false) };
  var t = $("errTxt"); if(t) t.oninput = function(){S.errText=this.value;saveCur(S)};
  var bp = $("btnPrev"); if(bp) bp.onclick = function(){ S.step=0; S.nameQ=""; S.sid=""; S.vrf=false; S.dobTry=""; S.nameOk=false; saveCur(S); render(); };
  if(S.ok!==null) sync();
  $("btnNext").onclick = function(){
    if(S.ok===null){ $("msg").innerHTML='<div class="err">请先选择「信息无误」或「信息有误」。</div>'; return; }
    if(S.ok===false && !S.errText.trim()){ $("msg").innerHTML='<div class="err">请填写错误内容，便于教务更正。</div>'; return; }
    var T = tickets(), old = T[S.sid];
    if(S.ok===false){
      var round = old ? (old.status==="wait" ? (old.round||1) : (old.round||0)+1) : 1;
      if(round > TICKET_MAX){ $("msg").innerHTML='<div class="err">同一档案你已提交 '+TICKET_MAX+' 次纠错，请携带证件材料到教务线下面谈处理。</div>'; return; }
      T[S.sid] = {status:"wait", round:round, text:S.errText, at:new Date().toISOString()};
    } else {
      if(old && (old.status==="fixed" || old.status==="rejected")){
        old.status="closed"; old.confirmedAt=new Date().toISOString(); old.ver=stu(S.sid)._ver; T[S.sid]=old;
      } else if(old && old.status==="wait"){
        delete T[S.sid];
      }
    }
    saveTickets(T);
    S.step=2; saveCur(S); render();
  };
}

function bindSubject(){

/* ---- 签名画布 ---- */
function initCanvas(id,cb){
  var c = $(id), ctx = c.getContext("2d"), dpr = window.devicePixelRatio||1;
  c.width = c.offsetWidth*dpr; c.height = c.offsetHeight*dpr;
  ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle="#0C447C";
  var drawing=false;
  function pos(e){var r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  c.onpointerdown=function(e){drawing=true;ctx.beginPath();var p=pos(e);ctx.moveTo(p.x,p.y);c.setPointerCapture(e.pointerId)};
  c.onpointermove=function(e){if(!drawing)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
  c.onpointerup=function(){if(!drawing)return;drawing=false;cb(c.toDataURL())};
  return ctx;
}
function clearCanvas(id){
  var c=$(id), ctx=c.getContext("2d");
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height); ctx.restore();
}
function drawStored(id,data){
  var c=$(id), ctx=c.getContext("2d"), img=new Image();
  img.onload=function(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(img,0,0,c.width,c.height);ctx.restore()};
  img.src=data;
}

    h += '<div class="err"><b>身份校验告警 '+badQ.length+' 条</b>同一设备出生日期校验失败（连续 '+FAIL_MAX+' 次将锁定 '+FAIL_LOCK_MIN+' 分钟）。最近：'+recent+'。<br>短时批量失败通常意味着有人在试探他人档案，请留意；若确系学生本人记错日期，请直接更正其档案并通知本人。</div>';
  }
  var pb = probeState();
  if(pb && pb.sids && pb.sids.length >= PROBE_MAX){
    var pn = pb.sids.map(function(id){ var s3 = stu(id); return esc(s3 ? (s3.cls+" "+s3.cn) : id) }).join("、");
    h += '<div class="err"><b>查询探测提示</b>本设备在 '+PROBE_WIN_MIN+' 分钟内查询过 <b>'+pb.sids.length+'</b> 名不同学生的档案：'+pn
      + '。<br>教室公用电脑多人轮流使用属正常情况；若非公用设备，请留意是否为非本人查询。<b>本提示仅作记录，不影响任何学生正常填写。</b></div>';
  }
  h += '<h2 class="sec" style="margin:22px 0 8px">报考汇总表</h2><div style="overflow:auto"><table>';
  h += '<tr><th>班级</th><th>姓名（大写）</th><th>性别</th><th>出生日期</th><th>信息核对</th><th>报考内容</th><th>提交时间</th><th>重填</th><th>纸质签署</th><th>操作</th></tr>';
  ids.forEach(function(id){
    var rec = r[id], s = stu(id);
    var st = rec.reSign ? '<span class="tag bad">需重新签署</span>' : (rec.paper==="已签"?'<span class="tag">已签</span>':'<span class="tag wait">'+esc(rec.paper||"未签")+'</span>');
    h += '<tr><td>'+s.cls+'</td><td class="mono">'+esc(rec.en)+'</td><td>'+esc(rec.g)+'</td><td>'+esc(rec.dob)+'</td>'
      + '<td>'+(rec.ok?'<span class="tag">无误</span>':'<span class="tag bad">有误</span>')+'</td>'
      + '<td>'+esc(pickedText(rec.picked,rec.other).join("；"))+'</td><td class="mono">'+esc(fmtTime(rec.subAt))+'</td>'
      + '<td>'+(rec.modCount?('<span class="tag warn">'+rec.modCount+' 次</span>'):'—')+'</td><td>'+st+'</td>'
      + '<td>'+(w==="closed"?'<span class="tag">已截止</span>':'<button class="mini" data-unlock="'+id+'">解锁重填</button>')+'</td></tr>';
  });
  h += '</table></div>';
  h += '<p class="hint" style="margin-top:8px">纸质签署状态：';
  h += '<select id="bulkCls" class="mini"><option value="">按班级批量标记</option>';
  CLASSES.forEach(function(c){h+='<option value="'+c+'">'+c+'</option>'});
  h += '</select> <select id="bulkSt" class="mini"><option value="已签">已签</option><option value="待补签">待补签</option><option value="未签">未签</option></select>';
  h += ' <button class="mini act" id="bulkGo">应用</button></p>';
  h += '<button class="btn gh noprint" id="btnCsv" style="width:auto">导出汇总 CSV</button>';
  h += '<div class="notice" style="margin-top:16px"><h4>班级纸质确认表 · 建议声明文案</h4>'
    + '<p class="hint" style="margin:0 0 8px">纸质表由教务自行排版，建议把下面这句话印在表头或表尾。姓名列建议只用中文名（同班无重名），不必再印姓名大写、性别与出生日期。</p>'
    + '<div style="font-size:13px;line-height:1.8">'+PAPER_NOTE+'</div></div>';
  h += '<h2 class="sec" style="margin:22px 0 8px">按科目统计</h2><table>';
  Object.keys(subCnt).forEach(function(k){ h += '<tr><td>'+esc(k)+'</td><td><b>'+subCnt[k]+'</b> 人</td></tr>' });
  h += '</table>';
  h += '<h2 class="sec" style="margin:22px 0 8px">按单元统计</h2><table>';
  Object.keys(unitCnt).sort().forEach(function(k){ h += '<tr><td>'+esc(k)+'</td><td><b>'+unitCnt[k]+'</b> 人次</td></tr>' });
  h += '</table>';
  h += '<h2 class="sec" style="margin:22px 0 8px">纠错工单（待处理 '+waitT.length+' · 已结 '+closedT.length+'）</h2>';
  if(!openT.length && !closedT.length) h += '<p class="hint">暂无</p>';
  else {
    h += '<table><tr><th>班级</th><th>姓名</th><th>错误内容</th><th>轮次</th><th>提交时间</th><th>状态</th><th>操作</th></tr>';
    openT.concat(closedT).forEach(function(id){
      var t = T[id], s = stu(id);
      var stt = t.status==="wait" ? '<span class="tag bad">待处理</span>'
        : t.status==="fixed" ? '<span class="tag warn">已更正待复核</span>'
        : t.status==="rejected" ? '<span class="tag wait">已驳回</span>' : '<span class="tag">已复核通过</span>';
      var act = t.status==="wait" ? '<button class="mini act" data-fix="'+id+'">更正信息</button> <button class="mini" data-rej="'+id+'">驳回</button>'
        : (t.status==="fixed"||t.status==="rejected") ? '<button class="mini" data-undo="'+id+'">撤销处理</button>' : '—';
      h += '<tr><td>'+esc(s.cls)+'</td><td>'+esc(s.cn)+'</td><td>'+esc(t.text)+'</td><td>'+(t.round||1)+'</td>'
        + '<td class="mono">'+esc(fmtTime(t.at))+'</td><td>'+stt+'</td><td>'+act+'</td></tr>';
    });
    h += '</table>';
  }
  h += '<h2 class="sec" style="margin:22px 0 8px">待学生复核名单（'+fixedT.length+'）</h2>';
  if(!fixedT.length) h += '<p class="hint">暂无</p>';
  else {
    var byC2 = {};
    fixedT.forEach(function(id){(byC2[stu(id).cls]=byC2[stu(id).cls]||[]).push(stu(id).cn)});
    h += '<table><tr><th>班级</th><th>需回来复核的学生</th></tr>';
    Object.keys(byC2).forEach(function(c){ h += '<tr><td>'+esc(c)+'</td><td>'+byC2[c].join("、")+'</td></tr>' });
    h += '</table>';
    h += '<p class="hint">此名单按班级导出后交班主任，由班主任点对点通知学生回来复核；系统不会主动推送。</p>';
    h += '<button class="btn gh noprint" id="btnCsv2" style="width:auto">导出待复核名单 CSV</button>';
  }
  h += '<h2 class="sec" style="margin:22px 0 8px">未提交名单（'+todo.length+'）</h2>';
  if(!todo.length) h += '<p class="hint">全部提交完成</p>';
  else { var byC={}; todo.forEach(function(s){(byC[s.cls]=byC[s.cls]||[]).push(s.cn)});
    h += '<table><tr><th>班级</th><th>未提交学生</th></tr>';
    Object.keys(byC).forEach(function(c){ h += '<tr><td>'+c+'</td><td>'+byC[c].join("、")+'</td></tr>' });
    h += '</table>'; }
  h += '<button class="btn gh noprint" id="btnBack" style="margin-top:18px">返回学生端</button></div>';
  return h;
}
function bindAdmin(){
  $("btnBack").onclick = function(){ S.admin=false; render(); };
  Array.prototype.forEach.call(document.querySelectorAll("button[data-unlock]"),function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-unlock"), r = load(), rec = r[id], s = stu(id);
      if(winState()==="closed"){ alert("填报窗口已关闭，学生端不再受理提交。\n如需变更请线下处理，并同步更新纸质确认表。"); return; }
      if(!confirm("确定解锁 "+s.cls+" "+s.cn+" 的报考申请？\n解锁后该生可重新填写一次并覆盖旧记录；若此前已完成纸质签署，将标记为「需重新签署」。")) return;
      rec.unlocked = true; save(r); render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("button[data-fix]"),function(b){
    b.onclick = function(){ ADMIN_EDIT = b.getAttribute("data-fix"); render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("button[data-rej]"),function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-rej"), s = stu(id);
      var note = prompt("驳回 "+s.cls+" "+s.cn+" 的纠错申请。\n请填写核实依据（学生会在页面看到）：");
      if(note===null) return;
      if(!note.trim()){ alert("必须填写核实依据，便于学生理解。"); return; }
      var T = tickets(); T[id].status="rejected"; T[id].note=note; T[id].rejectedAt=new Date().toISOString();
      saveTickets(T); render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("button[data-undo]"),function(b){
    b.onclick = function(){ var id=b.getAttribute("data-undo"), T=tickets(); T[id].status="wait"; T[id].note=""; saveTickets(T); render(); };
  });
  var edSave = $("edSave");
  if(edSave) edSave.onclick = function(){
    var id = ADMIN_EDIT;
    var base = STUDENTS.filter(function(s){return s.id===id})[0];
    var m = master(), cur = m[id]||{};
    var f = {en:$("ed_en").value, cn:$("ed_cn").value, g:$("ed_g").value, dob:$("ed_dob").value, cls:$("ed_cls").value};
    Object.keys(f).forEach(function(k){ f[k] = String(f[k]||"").trim() });
    f.en = f.en.toUpperCase().replace(/\s+/g," ");
    var note = $("ed_note").value.trim(), chg = {};
    Object.keys(f).forEach(function(k){
      var oldv = (cur[k]!==undefined ? cur[k] : base[k]);
      if(String(oldv)!==String(f[k])) chg[k] = {from:oldv, to:f[k]};
    });
    if(!Object.keys(chg).length){ alert("未检测到字段变更。若核实后确认原信息无误，请改用「驳回」。"); return; }
    if(!note){ alert("请填写处理依据（核了哪份材料）。"); return; }
    var nowIso = new Date().toISOString();
    m[id] = Object.assign({}, cur, f, {_ver:(cur._ver||1)+1, _chg:chg, _note:note, _by:"教务", _at:nowIso});
    saveMaster(m);
    var T = tickets();
    T[id] = Object.assign({}, T[id], {status:"fixed", fixedAt:nowIso, note:note, chg:chg, ver:m[id]._ver});
    saveTickets(T);
    ADMIN_EDIT = null; render();
  };
  var edCancel = $("edCancel");
  if(edCancel) edCancel.onclick = function(){ ADMIN_EDIT = null; render(); };
  var btnCsv2 = $("btnCsv2");
  if(btnCsv2) btnCsv2.onclick = function(){ download((SERVER_SEASON||"报考")+"-待复核名单.csv", reviewCsvLines().join("\n")); };
  $("bulkGo").onclick = function(){
    var c = $("bulkCls").value, stt = $("bulkSt").value;
    if(!c){ alert("请先选择班级"); return; }
    var r = load();
    Object.keys(r).forEach(function(id){ if(r[id].cls===c){ r[id].paper = stt; if(stt==="已签") r[id].reSign = false; } });
    save(r); render();
  };
  $("btnCsv").onclick = function(){ download((SERVER_SEASON||"报考")+"-报考汇总.csv", summaryCsvLines().join("\n")); };
  var bl = $("btnLogCsv");
  if(bl) bl.onclick = function(){ download((SERVER_SEASON||"报考")+"-输入时间与设备.csv", logCsvLines().join("\n")); };
  /* ---- 安全与合规设置 ---- */
  var cfgSave = $("cfgSave");
  if(cfgSave) cfgSave.onclick = function(){
    apiPost("/api/admin/season",{token:ADMIN_TOKEN, action:"config",
      secondFactor: $("cfg2fa").checked ? "sid4" : "off",
      privacyRequired: $("cfgPvReq").checked,
      privacyNote: $("cfgPvNote").value}).then(function(r){
      if(!r || !r.ok){ alert((r&&r.error)||"保存失败"); return; }
      adminRefresh().then(function(){ render(); alert("安全与合规设置已保存，学生端刷新后生效。"); });
    });
  };
  /* ---- 加密备份 / 恢复 ---- */
  var bkExport = $("bkExport");
  if(bkExport) bkExport.onclick = function(){
    var p = $("bkPass").value||"";
    if(p.length < 8){ alert("备份口令至少 8 位"); return; }
    apiPost("/api/admin/backup",{token:ADMIN_TOKEN, backupPass:p}).then(function(r){
      if(!r || !r.ok){ alert((r&&r.error)||"导出失败"); return; }
      download((r.seasonId||"报考")+"-加密备份-"+String(r.exportedAt||"").slice(0,10)+".bak", r.text, true);
      $("bkPass").value = "";
      alert("已导出加密备份文件。\n请连同备份口令离线保管；系统不会保存该口令。");
    });
  };
  var bkRestore = $("bkRestore");
  if(bkRestore) bkRestore.onclick = function(){
    var fi = $("bkFile"), f = fi && fi.files && fi.files[0];
    var p = $("bkPass2").value||"";
    if(!f){ alert("请选择 .bak 加密备份文件"); return; }
    if(!p){ alert("请输入备份口令"); return; }
    if(!confirm("将从备份写入考试季数据，确定继续？")) return;
    var rd = new FileReader();
    rd.onload = function(){
      var txt = String(rd.result||"").replace(/^\uFEFF/,"").trim();
      apiPost("/api/admin/restore",{token:ADMIN_TOKEN, text:txt, backupPass:p,
        overwrite: $("bkOverwrite").checked, setCurrent: $("bkCurrent").checked}).then(function(r){
        if(!r || !r.ok){ alert((r&&r.error)||"恢复失败"); return; }
        $("bkPass2").value = "";
        adminRefresh().then(function(){ render();
          alert("已恢复考试季 "+r.seasonId+"："+r.students+" 人 / "+r.records+" 条提交。"); });
      });
    };
    rd.readAsText(f);
  };
  /* ---- 考试季管理 ---- */
  var seaSwitch = $("seaSwitch");
  if(seaSwitch) seaSwitch.onclick = function(){
    var id = $("seaSel").value;
    if(!id) return;
    if(!confirm("切换到考试季「"+id+"」？\n当前页面数据将替换为该季内容。")) return;
    apiPost("/api/admin/season",{token:ADMIN_TOKEN, action:"switch", id:id}).then(function(r){
      if(!r || !r.ok){ alert((r&&r.error)||"切换失败"); return; }
      adminRefresh().then(function(){ render(); });
    });
  };
  var seaRefresh = $("seaRefresh");
  if(seaRefresh) seaRefresh.onclick = function(){ adminRefresh().then(function(){ render(); }); };
  var seaCreate = $("seaCreate");
  if(seaCreate) seaCreate.onclick = function(){
    var id = ($("seaId").value||"").trim(), nm = ($("seaName").value||"").trim();
    var stt = $("seaStart").value, en = $("seaEnd").value;
    if(!id){ alert("请填写考试季编号，例如 2026-winter"); return; }
    if(!stt || !en){ alert("请填写开放与截止时间"); return; }
    var clsRaw = ($("seaCls").value||"").trim();
    apiPost("/api/admin/season",{token:ADMIN_TOKEN, action:"create", id:id, name:nm||id, start:stt, end:en,
      classes: clsRaw ? clsRaw.split(/[,，]/).map(function(x){return x.trim()}).filter(Boolean) : CLASSES,
      withRoster: !!($("seaRoster") && $("seaRoster").checked), copyFrom: SERVER_SEASON}).then(function(r){
      if(!r || !r.ok){ alert((r&&r.error)||"新建失败"); return; }
      adminRefresh().then(function(){ render(); alert("已新建并切换到考试季「"+id+"」。\n请导入本季学生名单。"); });
    });
  };
  var rosGo = $("rosGo");
  if(rosGo) rosGo.onclick = function(){
    var txt = ($("rosTxt").value||"").trim();
    if(!txt){ alert("请粘贴名单，每行：学号,班级,中文名,姓名大写,性别,出生日期"); return; }
    var rows = txt.split(/\r?\n/).map(function(l){ return l.split(/[,，\t]/).map(function(x){return String(x||"").trim()}) })
      .filter(function(a){ return a.length>=6 && a[0] });
    if(!rows.length){ alert("未解析到有效行，请检查格式：学号,班级,中文名,姓名大写,性别,出生日期"); return; }
    var students = rows.map(function(a,i){ return {id:a[0]||("S"+i), cls:a[1], cn:a[2], en:a[3], g:a[4], dob:a[5]} });
    if(!confirm("将导入 "+students.length+" 名学生，替换本季现有名单。确定？")) return;
    apiPost("/api/admin/season",{token:ADMIN_TOKEN, action:"roster", students:students}).then(function(r){
      if(!r || !r.ok){ alert((r&&r.error)||"导入失败"); return; }
      adminRefresh().then(function(){ render(); alert("已导入 "+r.count+" 人，班级："+(r.classes||[]).join("、")); });
    });
  };
  var seaArchive = $("seaArchive");
  if(seaArchive) seaArchive.onclick = function(){
    if(!confirm("导出当前季三件套汇总 CSV、待复核名单 CSV、未提交名单 CSV？")) return;
    download((SERVER_SEASON||"报考")+"-报考汇总.csv", summaryCsvLines().join("\n"));
    download((SERVER_SEASON||"报考")+"-待复核名单.csv", reviewCsvLines().join("\n"));
    download((SERVER_SEASON||"报考")+"-未提交名单.csv", todoCsvLines().join("\n"));
    apiPost("/api/admin/season",{token:ADMIN_TOKEN, action:"archive", id:SERVER_SEASON}).then(function(r){
      if(r && r.ok) alert("已归档，该季转为只读存档。\n如需继续报考，请新建下一季。");
    });
  };
}

/* ================= 启动 ================= */
$("dbgWin").onchange = function(){ render() };
$("dbgAdmin").onclick = function(){
  if(API_ON && !ADMIN_TOKEN){
    var p = prompt("请输入教务后台口令：");
    if(p === null) return;
    adminLogin(p).then(function(ok){ if(ok){ S.admin = true; render(); } });
    return;
  }
  S.admin = true; render();
};
$("dbgReset").onclick = function(){
  if(!confirm("清空本机缓存的演示数据？\n（服务器上的数据不会删除）")) return;
  localStorage.removeItem(LSK); localStorage.removeItem(LSU); localStorage.removeItem(LSM); localStorage.removeItem(LST);
  localStorage.removeItem(LSF); localStorage.removeItem(LSA); localStorage.removeItem(LSLOG); clearProbe();
  ADMIN_EDIT = null; ADMIN_TOKEN = "";
  try{ sessionStorage.removeItem("reg_self_"+(SERVER_SEASON||"")); }catch(e){}
  S = freshState();
  render();
};
(function init(){
  try{ var c = JSON.parse(localStorage.getItem(LSU)||"null"); if(c) S = c; }catch(e){}
  try{ SERVER_SEASON = localStorage.getItem("reg_season")||"" }catch(e){}
  S.admin = false;
  /* 刷新后只恢复本人档案；恢复不到就要求重新验证，避免显示错误档案 */
  try{
    var _season = localStorage.getItem("reg_season")||"";
    var _self = JSON.parse(sessionStorage.getItem("reg_self_"+_season)||"null");
    if(S.vrf && _self && _self.id === S.sid){ STUDENTS = [_self]; }
    else if(S.vrf){ S = freshState(); saveCur(S); }
  }catch(e){ if(S.vrf){ S = freshState(); saveCur(S); } }
  render();
  bootServer().then(function(ok){ if(ok){ var d=$("dbgWin"); if(d) d.value="auto"; render(); } });
})();
